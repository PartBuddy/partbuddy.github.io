name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Sync pull requests from the app repository are built and tested, not deployed.
  pull_request:
  # A release in PartBuddy/partbuddy redeploys at once (its site-sync workflow).
  repository_dispatch:
    types: [partbuddy-release]
  workflow_dispatch:
  # Daily rebuild so the GitHub star count on the site stays current.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: 1
  # Read access to the releases of PartBuddy/partbuddy while that repository is private.
  # Without it the build uses the snapshot in src/data/releases.json.
  PARTBUDDY_RELEASES_TOKEN: ${{ secrets.PARTBUDDY_RELEASES_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 26
      - name: Test
        run: npm test
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
